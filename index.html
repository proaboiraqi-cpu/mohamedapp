<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>يوتييوب</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand" id="brand" aria-label="يوتييوب"><img src="wordmark.png" alt="" draggable="false"></div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-search" aria-label="بحث" data-ico="search"></button>
      <button class="icon-btn" aria-label="الإشعارات" data-ico="bell"></button>
    </div>
  </header>

  <div id="searchbar" hidden>
    <input id="q" type="search" placeholder="ابحث" autocomplete="off">
    <button class="icon-btn" id="q-close" aria-label="إغلاق" data-ico="close"></button>
  </div>

  <main id="views">
    <section class="view active" id="view-home"><div id="home-list"></div></section>
    <section class="view" id="view-shorts">
      <div id="shorts-feed"></div>
      <button id="short-back" class="icon-btn" aria-label="رجوع" data-ico="back"></button>
    </section>
    <section class="view" id="view-you"><div id="you-box"></div></section>
  </main>

  <nav id="bottomnav" dir="ltr">
    <button class="on" data-tab="home"><span class="ni" data-ico="home"></span><span>الرئيسية</span></button>
    <button data-tab="shorts"><span class="ni" data-ico="shorts"></span><span>Shorts</span></button>
    <button class="nav-add" aria-label="إنشاء"><span class="plus" data-ico="plus"></span></button>
    <button class="nav-subs"><span class="ni subs" data-ico="subs"></span><span>الاشتراكات</span></button>
    <button data-tab="you"><span class="ni"><span class="me" id="nav-av"></span></span><span>أنت</span></button>
  </nav>
</div>

<!-- صفحة المشاهدة -->
<div id="watch" hidden>
  <div class="yt-bar" id="yt-bar"><button class="icon-btn" id="yt-back" aria-label="رجوع" data-ico="down"></button></div>
  <div class="player" id="player" dir="ltr">
    <video id="vid" playsinline webkit-playsinline preload="metadata"></video>
    <div class="p-overlay" id="p-ov">
      <button class="icon-btn p-back" id="p-back" aria-label="رجوع" data-ico="down"></button>
      <div class="p-center"><button id="p-toggle" aria-label="تشغيل" data-ico="play"></button></div>
      <div class="p-bottom">
        <div class="p-row">
          <span id="p-time">0:00 / 0:00</span>
          <button class="icon-btn" id="p-full" aria-label="ملء الشاشة" data-ico="full"></button>
        </div>
        <div class="seek" id="seek"><div class="seek-fill" id="seek-fill"></div><div class="seek-knob" id="seek-knob"></div></div>
      </div>
    </div>
    <div id="p-spin" hidden></div>
    <div id="p-skip" hidden></div>
  </div>

  <div class="mini-bar">
    <div class="mini-title" id="mini-title"></div>
    <button class="icon-btn" id="mini-toggle" aria-label="تشغيل"></button>
    <button class="icon-btn" id="mini-close" aria-label="إغلاق" data-ico="close"></button>
  </div>

  <div class="watch-info">
    <div class="w-head">
      <h1 id="w-title"></h1>
      <div class="w-meta" id="w-meta"></div>
    </div>
    <div class="w-actions">
      <div class="pgroup">
        <button data-toggle="like"><span data-ico="like"></span><span>أعجبني</span></button>
        <button data-toggle="dislike" aria-label="لم يعجبني"><span data-ico="dislike"></span></button>
      </div>
      <button class="pill"><span data-ico="share"></span><span>مشاركة</span></button>
      <button class="pill"><span data-ico="download"></span><span>تنزيل</span></button>
      <button class="pill" data-toggle="save"><span data-ico="save"></span><span>حفظ</span></button>
    </div>
    <div class="w-ch">
      <div class="avatar" id="w-av"></div>
      <div class="w-chname"><b id="w-chn"></b></div>
      <button class="sub-btn" data-toggle="sub" data-t-on="تم الاشتراك" data-t-off="اشترك">اشترك</button>
    </div>
    <div id="w-next"></div>
  </div>
  <div class="mini-prog"><i id="mini-prog"></i></div>
</div>

<!-- شاشة الإيقاف (جهاز الطفل) -->
<div id="lock" hidden>
  <div id="lock-logo" data-logo="64"></div>
  <h2>الموقع متوقف حالياً</h2>
  <p>ارجع بعد شوية</p>
</div>

<!-- الإدارة (مخفية) -->
<div id="admin" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" crossorigin="anonymous"></script>
<script src="cloud.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
